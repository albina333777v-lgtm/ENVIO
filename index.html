\"lv-card\" aria-live=\"polite\">\n          <small id=\"lvN\">1 / 5<\/small>\n          <h3 id=\"lvT\">Elementary<\/h3>\n          <ul id=\"lvL\"><\/ul>\n          <div class=\"meta\"><span id=\"lvD\"><\/span><span id=\"lvG\"><\/span><\/div>\n        <\/div>\n      <\/div>\n      <p class=\"sp-hint\" data-kg=\"Деңгээлиңизди билбейсизби? <a href='#test'>10 суроолук тесттен өтүңүз<\/a>\">Не знаете свой уровень? <a href=\"#test\">Пройдите тест из 10 вопросов<\/a><\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Хайлайты как в Instagram — быстрое меню ===== -->\n<nav class=\"hl\" aria-label=\"Быстрое меню\">\n  <div class=\"wrap\">\n    <ul>\n      <li><a href=\"#sets\"><span class=\"r\"><i><svg><use href=\"#i-users\"/><\/svg><\/i><\/span><span data-kg=\"Топтор\">Группы<\/span><\/a><\/li>\n      <li><a href=\"#team\"><span class=\"r\"><i><svg><use href=\"#i-cap\"/><\/svg><\/i><\/span><span data-kg=\"Мугалимдер\">Преподаватели<\/span><\/a><\/li>\n      <li><a href=\"#best\"><span class=\"r\"><i><svg><use href=\"#i-trophy\"/><\/svg><\/i><\/span><span data-kg=\"Студенттер\">Студенты<\/span><\/a><\/li>\n      <li><a href=\"#sets\"><span class=\"r\"><i><svg><use href=\"#i-cal\"/><\/svg><\/i><\/span><span data-kg=\"Кабыл алуу\">Наборы<\/span><\/a><\/li>\n      <li><a href=\"#prices\"><span class=\"r\"><i><svg><use href=\"#i-tag\"/><\/svg><\/i><\/span><span data-kg=\"Баалар\">Цены<\/span><\/a><\/li>\n      <li><a href=\"#test\"><span class=\"r\"><i><svg><use href=\"#i-star\"/><\/svg><\/i><\/span><span data-kg=\"Тест\">Тест<\/span><\/a><\/li>\n      <li><a href=\"#reviews\"><span class=\"r\"><i><svg><use href=\"#i-chat\"/><\/svg><\/i><\/span><span data-kg=\"Пикирлер\">Отзывы<\/span><\/a><\/li>\n      <li><a href=\"#faq\"><span class=\"r\"><i><svg><use href=\"#i-q\"/><\/svg><\/i><\/span>FAQ<\/a><\/li>\n    <\/ul>\n  <\/div>\n<\/nav>\n\n<!-- ===== Наборы и расписание ===== -->\n<section class=\"s sets\" id=\"sets\">\n  <div class=\"wrap\">\n    <div class=\"sh\">\n      < Здравствуйте! Хочу в дневную группу английского\" data-wa-kg=\"Саламатсызбы! Күндүзгү англис тобуна жазылгым келет\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Жазылуу\">Записаться<\/span><\/a>\n      <\/article>\n      <article class=\"grp\">\n        <div class=\"top\"><b data-kg=\"Кечки\">Вечерние<\/b><span data-kg=\"популярдуу\">популярные<\/span><\/div>\n        <ul>\n          <li><span data-kg=\"ДШ · ШР · ЖМ\">ПН · СР · ПТ<\/span><b>18:30<\/b><\/li>\n          <li><span data-kg=\"ШЕ · БШ · ИШ\">ВТ · ЧТ · СБ<\/span><b>19:30<\/b><\/li>\n          <li><span>Intermediate<\/span><span class=\"free\" data-kg=\"орун бар\">есть места<\/span><\/li>\n        <\/ul>\n        <a class=\"btn btn-ghost\" data-wa=\"Здравствуйте! Хочу в вечернюю группу английского\" data-wa-kg=\"Саламатсызбы! Кечки англис тобуна жазылгым келет\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Жазылуу\">Записаться<\/span><\/a>\n      <\/article>\n    <\/div>\n    <div class=\"season\">\n      <svg width=\"22\" height=\"22\" style=\"color:var(--pink)\"><use href=\"#i-star\"/><\/svg>\n      <div><b data-kg=\"Күзгү кабыл алуу — 15-ноябрга чейин.\">Осенний набор — до 15 ноября.<\/b> <span data-kg=\"Топтор 1-декабрдан башталат. Топто 6–8 адам.\">Группы стартуют 1 декабря. В группе 6–8 человек.<\/span><\/div>\n      <a class=\"btn btn-v\" data-wa=\"Здравствуйте! Хочу попасть в осенний набор\" data-wa-kg=\"Саламатсызбы! Күзгү кабыл алууга жазылгым келет\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Орун ээлөө\">Забронировать место<\/span><\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Цены ===== -->\n<section class=\"s\" id=\"prices\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"badge\"><i><svg><use href=\"#i-tag\"/><\/svg><\/i><\/span>\n      <h2 data-kg=\"Баалар жана формат\">Цены и формат<\/h2>\n      <p data-kg=\"Айына төлөйсүз. Китептер жана сабактын материалдары баага кирет.\">Оплата помесячно. Учебники и материалы уроков уже входят в цену.<\/p><\/div><\/div>\n    <div class=\"prices\">\n      <article class=\"pr\">\n        <h3 data-kg=\"Онлайн топ\">Онлайн-группа<\/h3>\n        <div class=\"sum\">3 900 <small style=\"font-size:16px\">сом<\/small><\/div><div class=\"per\" data-kg=\"айына · 12 сабак\">в месяц · 12 уроков<\/div>\n        <ul><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Zoom аркылуу, үйдөн\">Занятия в Zoom из дома<\/span><\/li><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Сабактардын жазуулары\">Записи уроков<\/span><\/li><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Чат-топ жана үй тапшырма текшерүү\">Чат группы и проверка домашки<\/span><\/li><\/ul>\n        <a class=\"btn btn-ghost\" data-wa=\"Здравствуйте! Интересует онлайн-группа\" data-wa-kg=\"Саламатсызбы! Онлайн топ кызыктырат\" href=\"#\"><span data-kg=\"Онлайн топко\">Хочу онлайн<\/span><\/a>\n      <\/article>\n      <article class=\"pr hot\">\n        <span class=\"lbl\" data-kg=\"Көбүрөөк тандашат\">Выбирают чаще<\/span>\n        <h3 data-kg=\"Офлайн топ\">Офлайн-группа<\/h3>\n        <div class=\"sum\">4 500 <small style=\"font-size:16px\">сом<\/small><\/div><div class=\"per\" data-kg=\"айына · 12 сабак · 6–8 адам\">в месяц · 12 уроков · 6–8 человек<\/div>\n        <ul><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Ботаникалык бак ТКдагы класс\">Класс в ЖК «Ботанический сад»<\/span><\/li><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Speaking club бекер\">Speaking club бесплатно<\/span><\/li><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Ар деңгээлдин аягында сертификат\">Сертификат по окончании уровня<\/span><\/li><\/ul>\n        <a class=\"btn btn-wa\" data-wa=\"Здравствуйте! Интересует офлайн-группа\" data-wa-kg=\"Саламатсызбы! Офлайн топ кызыктырат\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Офлайн топко\">Хочу в группу<\/span><\/a>\n      <\/article>\n      <article class=\"pr\">\n        <h3 data-kg=\"Жеке сабак\">Индивидуально<\/h3>\n        <div class=\"sum\">900 <small style=\"font-size:16px\">сом<\/small><\/div><div class=\"per\" data-kg=\"1 сабак · 60 мүнөт\">за урок · 60 минут<\/div>\n        <ul><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Өз максатыңызга программа\">Программа под вашу цель<\/span><\/li><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"IELTS, жумуш, саякат\">IELTS, работа, переезд<\/span><\/li><li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Каалаган убакыт\">Любое удобное время<\/span><\/li><\/ul>\n        <a class=\"btn btn-ghost\" data-wa=\"Здравствуйте! Интересуют индивидуальные занятия\" data-wa-kg=\"Саламатсызбы! Жеке сабактар кызыктырат\" href=\"#\"><span data-kg=\"Жеке сабакка\">Хочу индивидуально<\/span><\/a>\n      <\/article>\n    <\/div>\n    <p class=\"trial\"><svg><use href=\"#i-star\"/><\/svg><span data-kg=\"Сынамык сабак жана деңгээлди аныктоо — бекер, 40 мүнөт.\">Пробный урок и определение уровня — бесплатно, 40 минут.<\/span><\/p>\n  <\/div>\n<\/section>\n\n<!-- ===== Тест уровня (10 вопросов) ===== -->\n<section class=\"s\" id=\"test\" style=\"padding-top:10px\">\n  <div class=\"wrap tst\">\n    <div class=\"tst-side\">\n      <span class=\"badge\"><i><svg><use href=\"#i-star\"/><\/svg><\/i><\/span>\n      <h2 data-kg=\"Деңгээлиңизди билиңиз\">Узнайте свой уровень<\/h2>\n      <p data-kg=\"10 суроо, болжол менен 2 мүнөт. Деңгээлди жана ылайыктуу топту дароо көрсөтөбүз, жыйынтыкты WhatsAppка жөнөтсөңүз болот.\">10 вопросов, около 2 минут. Сразу покажем уровень и подходящую группу, а результат можно отправить нам в WhatsApp.<\/p>\n      <ul class=\"tst-l\">\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Каттоосуз жана телефон номерисиз\">Без регистрации и номера телефона<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Туура жооп дароо көрүнөт\">Правильный ответ видно сразу<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Так деңгээлди сынамык сабакта тактайбыз\">Точный уровень уточним на пробном уроке<\/span><\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"qbox\" id=\"qbox\" aria-live=\"polite\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Преподаватели ===== -->\n<section class=\"s\" id=\"team\" style=\"padding-top:20px\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"badge\"><i><svg><use href=\"#i-cap\"/><\/svg><\/i><\/span>\n      <h2 data-kg=\"Мугалимдер\">Преподаватели<\/h2>\n      <p data-kg=\"Ар бир мугалим өз багытын алып барат — сиздин максатыңызга жараша тандайбыз.\">У каждого своё направление — подберём преподавателя под вашу цель.<\/p><\/div><\/div>\n    <div class=\"teach\">\n      <article class=\"tc\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"in\"><b>Айпери Т.<\/b><div class=\"sp\" data-kg=\"Сүйлөшүү англисчеси, Elementary–Intermediate\">Разговорный английский, Elementary–Intermediate<\/div><div class=\"tags\"><span>Speaking<\/span><span data-kg=\"5 жыл\">5 лет<\/span><\/div><\/div><\/article>\n      <article class=\"tc\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"in\"><b>Нурсултан А.<\/b><div class=\"sp\" data-kg=\"IELTS даярдоо, Upper-Intermediate–Advanced\">Подготовка к IELTS, Upper-Intermediate–Advanced<\/div><div class=\"tags\"><span>IELTS 8.0<\/span><span data-kg=\"6 жыл\">6 лет<\/span><\/div><\/div><\/article>\n      <article class=\"tc\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"in\"><b>Алина К.<\/b><div class=\"sp\" data-kg=\"Өспүрүмдөр 12–17 жаш, грамматика\">Подростки 12–17 лет, грамматика<\/div><div class=\"tags\"><span>Teens<\/span><span>CELTA<\/span><\/div><\/div><\/article>\n      <article class=\"tc\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"in\"><b>Эрлан М.<\/b><div class=\"sp\" data-kg=\"Бизнес англисчеси, жумуш маеги\">Бизнес-английский, собеседования<\/di ox\"));\n<\/script>\n<\/body>\n<\/html>\n", "v2-grafik.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ENVIO — подберите группу под свой график<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap\">\n<style>\n/* Вариант 2 «График» — сайт как ежедневник.\n   Аудитория: работающие взрослые и родители, которым важно КОГДА и СКОЛЬКО.\n   Главная фишка — подбор группы прямо на первом экране: время → формат → уровень → готовая заявка в WhatsApp.\n   Цвета: чернильный тёмно-фиолетовый, бумага в клетку, жёлтый маркер на времени, зелёный — свободные места. */\n:root{\n  --ink:#1E1A3C; --ink-2:#4A4568; --muted:#77728F; --paper:#F7F6FB; --white:#fff; --line:#E3E0EE;\n  --violet:#6A2BC2; --violet-d:#4B1C8C; --marker:#FFE45C; --mint:#1FA36B; --mint-l:#DDF5E9; --rose:#F05D7A;\n  --h:\"Rubik\",system-ui,sans-serif; --b:\"Golos Text\",system-ui,sans-serif;\n  --mb-bg:#fff; --mb-fg:var(--ink); --ph-bg:#ECE8F7; --ph-fg:#A39BC4;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:110px}\nbody{margin:0;color:var(--ink);font:16px/1.5 var(--b);background:var(--paper);\n  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}\nh1,h2,h3{font-family:var(--h);line-height:1.1;margin:0;letter-spacing:-.015em}\na{color:inherit}\nbutton{font:inherit;cursor:pointer}\n:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}\n.wrap{max-width:1220px;margin:0 auto;padding:0 28px}\n.btn{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:12px;padding:13px 20px;font:600 15px/1 var(--b);text-decoration:none;white-space:nowrap}\n.btn svg{width:19px;height:19px}\n.btn-wa{background:#25D366;color:#fff}\n.btn-ink{background:var(--ink);color:#fff}\n.btn-line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}\n.btn-gis{background:#2FB540;color:#fff}\n\n/* ---------- верхняя полоса и шапка ---------- */\n.top{background:var(--ink);color:#C9C4E6;font-size:13.5px}\n.top .wrap{display:flex;gap:22px;align-items:center;height:38px}\n.top a{text-decoration:none;color:#fff;font-weight:600;display:inline-flex;gap:6px;align-items:center}\n.top svg{width:15px;height:15px}\n.top .r{margin-left:auto;display:flex;gap:18px}\nheader{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}\n.hd{display:flex;align-items:center;gap:26px;height:68px}\n.logo{display:flex;align-items:center;gap:10px;text-decoration:none}\n.logo svg{width:40px;height:40px}\n.logo b{font:800 21px/1 var(--h);letter-spacing:.02em;color:var(--violet-d)}\n.hd nav{display:flex;gap:22px}\n.hd nav a{text-decoration:none;font-weight:500;color:var(--ink-2);font-size:15px;white-space:nowrap}\n.hd nav a:hover{color:var(--violet)}\n.hd .tel{margin-left:auto;text-decoration:none;font:700 19px/1 var(--h);white-space:nowrap}\n.hd .tel small{display:block;font:500 12px var(--b);color:var(--muted);margin-top:4px}\n.lang{display:flex;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line);padding:3px}\n.lang button{border:0;background:none;border-radius:7px;padding:6px 10px;font:700 12.5px/1 var(--b);color:var(--muted)}\n.lang button[aria-pressed=\"true\"]{background:var(--ink);color:#fff}\n.ic{display:none}\n\n/* ---------- первый экран: подбор группы ---------- */\n.hero{padding:22px 0 30px}\n.hero .wrap{display:grid;grid-template-columns:.92fr 1.08fr;gap:30px;align-items:stretch}\n.hero .wrap>*,.rv>*,.ct>*,.team>*{min-width:0}\n.hero h1{font-size:clamp(30px,3.3vw,44px);font-weight:800}\n.hero h1 em{font-style:normal;color:var(--violet)}\n.hero .lead{color:var(--ink-2);font-size:16.5px;margin:12px 0 16px;max-width:490px}\n.filt{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 1px 0 var(--line),0 20px 40px -30px rgba(40,20,90,.35)}\n.fl{margin-bottom:11px}\n.fl:last-child{margin-bottom:0}\n.fl>span{display:block;font-weight:600;font-size:13.5px;color:var(--muted);margin-bottom:7px}\n.chips{display:flex;flex-wrap:wrap;gap:7px}\n.chips button{border:0;border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px;background:var(--paper);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}\n.chips button[aria-pressed=\"true\"]{background:var(--ink);color:#fff;box-shadow:none}\n.chips button small{font-weight:500;opacity:.7;margin-left:4px}\n.hero-call{display:flex;gap:10px;align-items:center;margin-top:18px;color:var(--muted);font-size:14px}\n\n.res{background:#fff;border-radius:20px;box-shadow:0 1px 0 var(--line),0 20px 40px -30px rgba(40,20,90,.35);display:flex;flex-direction:column;overflow:hidden}\n.res-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1.5px solid var(--line)}\n.res-h b{font:700 17px var(--h)}\n.res-h span{font-size:13.5px;color:var(--muted)}\n.list{overflow:auto;max-height:max(320px,calc(100vh - 250px));padding:6px 12px 10px}\n.g{display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:center;padding:14px 10px;border-bottom:1px dashed var(--line)}\n.g:last-child{border-bottom:0}\n.g .time{font:800 24px/1 var(--h);justify-self:start}\n.g .time .tm{position:relative;z-index:0}\n.g .time .tm::before{content:\"\";position:absolute;left:-4px;right:-4px;bottom:1px;height:11px;background:var(--marker);z-index:-1;border-radius:3px;transform:skew(-8deg)}\n.g .time small{display:block;font:600 12px var(--b);color:var(--muted);margin-top:8px}\n.g .info b{display:block;font:700 16px var(--h)}\n.g .info span{font-size:13.5px;color:var(--muted)}\n.g .seat{display:flex;gap:4px;margin-top:7px;align-items:center;font-size:12.5px;font-weight:600;color:var(--mint)}\n.g .seat i{width:9px;height:9px;border-radius:3px;background:var(--line)}\n.g .seat i.f{background:var(--mint)}\n.g .seat.low{color:var(--rose)}\n.g .seat.low i.f{background:var(--rose)}\n.g .btn{padding:11px 14px;font-size:14px}\n.fm{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px;background:#EFE7FF;color:var(--violet)}\n.fm.on{background:#E3F1FF;color:#1E6FC2}\n.empty{padding:34px 20px;text-align:center}\n.empty b{display:block;font:700 19px var(--h);margin-bottom:6px}\n.empty p{color:var(--muted);margin:0 0 16px}\n\n/* ---------- общие секции ---------- */\nsection.s{padding:56px 0}\n.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}\n.sh h2{font-size:clamp(26px,3vw,38px);display:flex;align-items:center;gap:14px}\n.sh p{margin:8px 0 0;color:var(--ink-2);max-width:540px}\n.tab{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--ink);color:var(--marker);flex:0 0 46px}\n.tab svg{width:23px;height:23px}\n.card{background:#fff;border-radius:20px;box-shadow:0 1px 0 var(--line),0 20px 40px -32px rgba(40,20,90,.35)}\n\n/* неделя */\n.week{padding:18px;overflow-x:auto}\n.wk{display:grid;grid-template-columns:80px repeat(6,minmax(120px,1fr));gap:6px;min-width:820px}\n.wk .dh{font:700 14px var(--h);text-align:center;padding:6px 0;color:var(--ink-2)}\n.wk .rh{font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center}\n.wk .c{min-height:76px;border-radius:12px;background:var(--paper);padding:5px;display:flex;flex-direction:column;gap:4px}\n.blk{border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.25;color:#fff}\n.blk b{display:block;font:700 13px var(--h)}\n.l1{background:#9B7BE0}.l2{background:#7A4FD1}.l3{background:#6A2BC2}.l4{background:#4B1C8C}.l5{background:#1E1A3C}\n.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--ink-2)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend i{width:12px;height:12px;border-radius:4px}\n\n/* наборы по сезонам */\n.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:8px}\n.sea{padding:20px;border-right:1.5px dashed var(--line);position:relative}\n.sea:last-child{border-right:0}\n.sea .when{font:700 13px var(--b);color:var(--muted)}\n.sea h3{font-size:21px;margin:6px 0 8px}\n.sea p{margin:0;color:var(--ink-2);font-size:14.5px}\n.sea .st{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;border-radius:8px;padding:5px 9px;background:var(--paper);color:var(--muted)}\n.sea.now{background:var(--ink);color:#fff;border-radius:16px;border-right:0}\n.sea.now .when{color:var(--marker)}\n.sea.now p{color:#CFCAE9}\n.sea.now .st{background:var(--marker);color:var(--ink)}\n\n/* цены — таблица */\n.ptab{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}\n.ptab th,.ptab td{padding:15px 18px;text-align:left;border-bottom:1.5px solid var(--line)}\n.ptab thead th{font:700 16px var(--h);vertical-align:bottom}\n.ptab thead th small{display:block;font:500 13px var(--b);color:var(--muted);margin-top:4px}\n.ptab .sum{font:800 26px/1 var(--h);font-variant-numeric:tabular-nums}\n.ptab .sum small{font:500 13px var(--b);color:var(--muted)}\n.ptab td:first-child{color:var(--ink-2);font-weight:500}\n.ptab .hl{background:#F4EEFF}\n.ptab thead .hl{border-radius:14px 14px 0 0}\n.ptab tr:last-child td{border-bottom:0}\n.ptab svg{width:20px;height:20px;color:var(--mint)}\n.ptab .no{color:#C4C0D6}\n.pfoot{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--marker);border-radius:0 0 20px 20px;font-weight:600}\n\n/* преподаватели — строки */\n.team{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.tr{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:14px}\n.tr .ph{width:96px;height:96px;border-radius:16px}\n.tr b{font:700 18px var(--h)}\n.tr .sp{color:var(--ink-2);font-size:14.5px;margin:3px 0 8px}\n.tr .gr{display:flex;gap:6px;flex-wrap:wrap}\n.tr .gr span{font-size:12.5px;font-weight:600;border-radius:7px;padding:4px 8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}\n\n/* отзывы */\n.rv{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}\n.big{background:var(--ink);color:#fff;border-radius:22px;padding:30px;display:flex;flex-direction:column}\n.big .qm{font:800 70px/0.6 var(--h);color:var(--marker);height:34px}\n.big blockquote{margin:0;font:500 22px/1.45 var(--b)}\n.big .who{margin-top:auto;padding-top:22px;display:flex;align-items:center;gap:12px}\n.av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 17px var(--h);background:var(--marker);color:var(--ink);flex:0 0 46px}\n.big .who b{display:block}\n.big .who span{color:#BEB8DE;font-size:13.5px}\n.rcol{display:grid;gap:12px}\n.rc{padding:18px 20px}\n.rc .stars{display:flex;gap:2px;color:#FFB020}\n.rc .stars svg{width:15px;height:15px}\n.rc p{margin:8px 0 10px;font-size:15px}\n.rc .who{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}\n.rc .who .av{width:32px;height:32px;flex-basis:32px;font-size:13px;border-radius:9px;background:#EFE7FF;color:var(--violet)}\n.rc .who b{color:var(--ink)}\n.rsum{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:14px;color:var(--ink-2)}\n.rsum b{font:800 22px var(--h);color:var(--ink)}\n\n/* контакты */\n.ct{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n.ci{padding:28px}\n.ci h2{font-size:clamp(24px,2.6vw,34px);margin-bottom:6px}\n.ci .row{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:13px 0;border-bottom:1.5px solid var(--line);font-size:15.5px}\n.ci .row span{color:var(--muted)}\n.ci .row a{text-decoration:none;font-weight:700}\n.ci .cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}\n.map{border-radius:20px;overflow:hidden;position:relative;min-height:340px;background:#EEEAF6}\n.map svg{position:absolute;inset:0;width:100%;height:100%}\n.map .pinm{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);text-align:center}\n.map .pinm b{display:block;background:var(--ink);color:#fff;border-radius:12px;padding:9px 13px;font-size:14px;white-space:nowrap}\n.map .pinm i{display:block;width:14px;height:14px;background:var(--ink);transform:rotate(45deg);margin:-8px auto 0}\n.map .btn{position:absolute;right:16px;bottom:16px}\nfooter{padding:24px 0 34px;color:var(--muted);font-size:13.5px}\nfooter .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}\n\n/* тест уровня — карточка теста + «как это работает» */\n.tst{display:grid;grid-template-columns:1.45fr .55fr;gap:18px;align-items:stretch}\n.qbox{padding:24px 26px;--qa:var(--violet);--qopt:var(--paper);--qh:var(--h);--qtrack:var(--line);--qnext:var(--marker);--qcall:var(--ink);--qr:12px}\n.qbox .qt-opts button{box-shadow:inset 0 0 0 1.5px var(--line)}\n.tst-a{padding:20px 22px}\n.tst-a h3{font-size:17px;margin-bottom:6px}\n.tst-a ol{margin:0;padding:0;list-style:none;counter-reset:s}\n.tst-a li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1.5px dashed var(--line)}\n.tst-a li:last-child{border-bottom:0}\n.tst-a li::before{content:counter(s);width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--marker);display:grid;place-items:center;font:700 15px var(--h)}\n.tst-a b{display:block;font:700 15.5px/1.25 var(--h)}\n.tst-a span{font-size:13.5px;color:var(--ink-2)}\n.tlink{display:inline-block;margin-top:9px;font-size:13.5px;font-weight:600;color:var(--violet)}\n\n/* ---------- адаптив ---------- */\n@media (max-width:1060px){.hd nav{display:none}.seasons{grid-template-columns:1fr 1fr}.sea:nth-child(2){border-right:0}}\n@media (max-width:760px){\n  .wrap{padding:0 16px}\n  .top .r,.top .addr{display:none}\n  .top .wrap{justify-content:center;height:34px}\n  .hd{height:60px;gap:10px}\n  .hd .tel,.hd>.btn{display:none}\n  .lang{margin-left:auto}\n  .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line)}\n  .ic.w{background:#25D366;color:#fff;box-shadow:none}\n  .ic svg{width:20px;height:20px}\n  .hero{padding:20px 0 26px}\n  .hero .wrap,.rv,.ct,.team{grid-template-columns:1fr}\n  .hero h1{font-size:30px}\n  .hero .lead{font-size:16px;margin:12px 0 16px}\n  .filt{padding:16px}\n  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}\n  .chips button{flex:0 0 auto}\n  .list{max-height:none}\n  .g{grid-template-columns:70px 1fr;gap:12px}\n  .g .time{font-size:20px}\n  .g .btn{grid-column:1/-1;justify-content:center}\n  .hero-call{display:none}\n  section.s{padding:40px 0}\n  .sh{display:block}\n  .sh h2{font-size:25px}\n  .tab{width:40px;height:40px;flex-basis:40px}\n  .seasons{grid-template-columns:1fr}\n  .tst{grid-template-columns:1fr}\n  .qbox{padding:20px 16px}\n  .sea{border-right:0;border-bottom:1.5px dashed var(--line)}\n  .ptab{font-size:13.5px}\n  .ptab th,.ptab td{padding:12px 8px}\n  .ptab .sum{font-size:19px}\n  .ptab thead th small{display:none}\n  .pfoot{flex-direction:column;align-items:stretch;text-align:center}\n  .big{padding:24px}.big blockquote{font-size:18px}\n  .ci{padding:22px 18px}\n  .ci .row{grid-template-columns:90px 1fr}\n  .ci .cta .btn{flex:1;justify-content:center}\n  .map{min-height:240px}\n}\n<\/style>\n<\/head>\n<body>\n<!--SWITCH:START-->\n<style>\n  .sw-bar{position:sticky;top:0;z-index:100;display:none;align-items:center;gap:12px;flex-wrap:wrap;\n    background:#1a1028;color:#fff;font:500 13px/1.2 system-ui,\"Segoe UI\",sans-serif;\n    padding:7px max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left))}\n  body.has-sw .sw-bar{display:flex}\n  body.has-sw header{top:var(--swh,44px)}\n  .sw-bar .sw-t{font-weight:700;letter-spacing:.08em;white-space:nowrap} ><use href=\"#i-pin\"/><\/svg>2ГИС<\/a>\n    <a href=\"https://www.instagram.com/envio_bishkek\" target=\"_blank\" rel=\"noopener\"><svg><use href=\"#i-ig\"/><\/svg>@envio_bishkek<\/a>\n  <\/div>\n<\/div><\/div>\n\n<header>\n  <div class=\"wrap hd\">\n    <a class=\"logo\" href=\"#top\" aria-label=\"ENVIO, на главную\">\n      <svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><circle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#4B1C8C\"/><path d=\"M25 30.5c-4 .3-7.4-2.4-7.4-6.2 0-3.4 2.8-6 6.2-6 3.6 0 6.5 2.8 6.5 6.6 0 5.6-4.6 9.6-10.3 9.6-6 0-10.6-4.5-10.6-10.4C9.4 16 15.6 10 23.5 10c5.4 0 9.6 2.5 12 6.2\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><path d=\"m31.5 11.3 5.4 5.6 1.5-7.8z\" fill=\"#FFE45C\"/><\/svg>\n      <b>ENVIO<\/b>\n    <\/a>\n    <nav aria-label=\"Разделы\">\n      <a href=\"#pick\" data-kg=\"Топтор\">Группы<\/a>\n      <a href=\"#week\" data-kg=\"Жума\">Неделя<\/a>\n      <a href=\"#test\" data-kg=\"Тест\">Тест<\/a>\n      <a href=\"#prices\" data-kg=\"Баалар\">Цены<\/a>\n      <a href=\"#team\" data-kg=\"Мугалимдер\">Преподаватели<\/a>\n      <a href=\"#reviews\" data-kg=\"Пикирлер\">Отзывы<\/a>\n    <\/nav>\n    <a class=\"tel\" href=\"tel:+996558399955\">+996 558 399 955<small data-kg=\"ДШ–ИШ 9:00–20:00\">Пн–Сб 9:00–20:00<\/small><\/a>\n    <a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Сынамык сабак\">Пробный урок<\/span><\/a>\n    <a class=\"ic\" href=\"tel:+996558399955\" aria-label=\"Позвонить\" data-kg-aria=\"Чалуу\"><svg><use href=\"#i-phone\"/><\/svg><\/a>\n    <a class=\"ic w\" data-wa href=\"#\" aria-label=\"WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a>\n    <div class=\"lang\" role=\"group\" aria-label=\"Язык\"><button data-l=\"ru\">RU<\/button><button data-l=\"kg\">KG<\/button><\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n<!-- ===== Первый экран: подбор группы ===== -->\n<section class=\"hero\" id=\"pick\">\n  <div class=\"wrap\">\n    <div>\n      <h1 data-kg=\"Англис тили <em>сиздин графигиңизге<\/em> ылайык\">Английский, который <em>влезет в ваш график<\/em><\/h1>\n      <p class=\"lead\" data-kg=\"Эртең менен, түштө же кечинде — офлайн же онлайн. Убакытты жана деңгээлди тандаңыз — бош орду бар топторду көрсөтөбүз.\">Утром, днём или вечером — офлайн или онлайн. Выберите время и уровень — покажем группы со свободными местами.<\/p>\n      <div class=\"filt\" role=\"group\" aria-label=\"Фильтр групп\">\n        <div class=\"fl\"><span data-kg=\"Качан ыңгайлуу?\">Когда удобно?<\/span>\n          <div class=\"chips\" data-f=\"part\">\n            <button data-v=\"all\" aria-pressed=\"true\" data-kg=\"Баары\">Любое<\/button>\n            <button data-v=\"am\" aria-pressed=\"false\" data-kg=\"Эртең менен <small>9–12<\/small>\">Утро <small>9–12<\/small><\/button>\n            <button data-v=\"pm\" aria-pressed=\"false\" data-kg=\"Түштө <small>12–17<\/small>\">День <small>12–17<\/small><\/button>\n            <button data-v=\"ev\" aria-pressed=\"false\" data-kg=\"Кечинде <small>17–21<\/small>\">Вечер <small>17–21<\/small><\/button>\n          <\/div><\/div>\n        <div class=\"fl\"><span data-kg=\"Формат\">Формат<\/span>\n          <div class=\"chips\" data-f=\"fmt\">\n            <button data-v=\"all\" aria-pressed=\"true\" data-kg=\"Баары\">Любой<\/button>\n            <button data-v=\"off\" aria-pressed=\"false\" data-kg=\"Офлайн, Айтматов 4\">Офлайн, Айтматова 4<\/button>\n            <button data-v=\"on\" aria-pressed=\"false\" data-kg=\"Онлайн, Zoom\">Онлайн, Zoom<\/button>\n          <\/div><\/div>\n        <div class=\"fl\"><span data-kg=\"Деңгээлиңиз\">Ваш уровень<\/span>\n          <div class=\"chips\" data-f=\"lvl\">\n            <button data-v=\"all\" aria-pressed=\"true\" data-kg=\"Билбейм\">Не знаю<\/button>\n            <button data-v=\"1\" aria-pressed=\"false\">Elementary<\/button>\n            <button data-v=\"2\" aria-pressed=\"false\">Pre-Int<\/button>\n            <button data-v=\"3\" aria-pressed=\"false\">Intermediate<\/button>\n            <button data-v=\"4\" aria-pressed=\"false\">Upper<\/button>\n            <button data-v=\"5\" aria-pressed=\"false\">Advanced<\/button>\n          <\/div><a class=\"tlink\" href=\"#test\" data-kg=\"Деңгээлиңизди билбейсизби? 10 суроолук тест\">Не знаете уровень? Тест из 10 вопросов<\/a><\/div>\n      <\/div>\n      <p class=\"hero-call\"><svg width=\"18\" height=\"18\"><use href=\"#i-phone\"/><\/svg><span data-kg=\"Тандоо кыйынбы? Чалыңыз:\">Сложно выбрать? Позвоните:<\/span> <a href=\"tel:+996558399955\" style=\"font-weight:700;color:var(--ink)\">+996 558 399 955<\/a><\/p>\n    <\/div>\n\n    <div class=\"res\" aria-live=\"polite\">\n      <div class=\"res-h\"><b id=\"resT\"><\/b><span data-kg=\"1-декабрдан старт\">старт 1 декабря<\/span><\/div>\n      <div class=\"list\" id=\"list\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Неделя ===== -->\n<section class=\"s\" id=\"week\" style=\"padding-top:20px\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><h2><span class=\"tab\"><svg><use href=\"#i-cal\"/><\/svg><\/span><span data-kg=\"ENVIOнун жумасы\">Неделя ENVIO<\/span><\/h2>\n      <p data-kg=\"Бардык топтор бир таблицада. Түсү — деңгээл: ачыгыраак — башталгыч, кочкулу — жогорку.\">Все группы в одной таблице. Цвет — уровень: светлее — начальный, темнее — продвинутый.<\/p><\/div><\/div>\n    <div class=\"card week\"><div class=\"wk\" id=\"wk\"><\/div>\n      <div class=\"legend\"><span><i class=\"l1\"><\/i>Elementary<\/span><span><i class=\"l2\"><\/i>Pre-Intermediate<\/span><span><i class=\"l3\"><\/i>Intermediate<\/span><span><i class=\"l4\"><\/i>Upper-Intermediate<\/span><span><i class=\"l5\"><\/i>Advanced / IELTS<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Тест уровня (10 вопросов) ===== -->\n<section class=\"s\" id=\"test\" style=\"padding-top:10px\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><h2><span class=\"tab\"><svg><use href=\"#i-q\"/><\/svg><\/span><span data-kg=\"Деңгээл тести\">Тест уровня<\/span><\/h2>\n      <p data-kg=\"Кайсы топту тандоону билбейсизби? 10 суроо — деңгээлди жана ыңгайлуу убакытты көрсөтөбүз.\">Не знаете, какую группу выбрать? 10 вопросов — покажем уровень и подходящее время.<\/p><\/div><\/div>\n    <div class=\"tst\">\n      <div class=\"card qbox\" id=\"qbox\" aria-live=\"polite\"><\/div>\n      <aside class=\"card tst-a\">\n        <h3 data-kg=\"Бул кантип иштейт\">Как это работает<\/h3>\n        <ol>\n          <li><div><b data-kg=\"10 суроого жооп бериңиз\">Ответьте на 10 вопросов<\/b><span data-kg=\"Болжол менен 2 мүнөт\">Около 2 минут<\/span><\/div><\/li>\n          <li><div><b data-kg=\"Деңгээлди жана топту алыңыз\">Получите уровень и группу<\/b><span data-kg=\"Туура жооптор дароо көрүнөт\">Правильные ответы видно сразу<\/span><\/div><\/li>\n          <li><div><b data-kg=\"WhatsAppка жөнөтүңүз\">Отправьте в WhatsApp<\/b><span data-kg=\"Администратор жооп берип, сынамык сабакка жазат\">Администратор ответит и запишет на пробный урок<\/span><\/div><\/li>\n        <\/ol>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Сезонные наборы ===== -->\n<section class=\"s\" id=\"sets\" style=\"padding-top:10px\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><h2><span class=\"tab\"><svg><use href=\"#i-users\"/><\/svg><\/span><span data-kg=\"Сезондук кабыл алуулар\">Сезонные наборы<\/span><\/h2>\n      <p data-kg=\"Жаңы топтор жылына төрт жолу башталат. Азыр — күзгү кабыл алуу.\">Новые группы стартуют четыре раза в год. Сейчас идёт осенний набор.<\/p><\/div>\n      <a class=\"btn btn-ink\" data-wa=\"Здравствуйте! Хочу записаться в осенний набор\" data-wa-kg=\"Саламатсызбы! Күзгү кабыл алууга жазылгым келет\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Күзгү топко жазылуу\">Записаться в осенний набор<\/span><\/a><\/div>\n    <div class=\"card seasons\">\n      <div class=\"sea\"><div class=\"when\" data-kg=\"Сентябрь\">Сентябрь<\/div><h3 data-kg=\"Окуу жылы\">Учебный год<\/h3><p data-kg=\"Бардык деңгээлдер, өспүрүмдөр үчүн топтор\">Все уровни, группы для подростков<\/p><span class=\"st\" data-kg=\"башталды\">идёт<\/span><\/div>\n      <div class=\"sea now\"><div class=\"when\" data-kg=\"Ноябрь · азыр\">Ноябрь · сейчас<\/div><h3 data-kg=\"Күзгү кабыл алуу\">Осенний набор<\/h3><p data-kg=\"Эртең мененки жана кечки топтор. Кабыл алуу 15-ноябрга чейин.\">Утренние и вечерние группы. Приём заявок до 15 ноября.<\/p><span class=\"st\" data-kg=\"9 орун калды\">осталось 9 мест<\/span><\/div>\n      <div class=\"sea\"><div class=\"when\" data-kg=\"Февраль\">Февраль<\/div><h3 data-kg=\"Кышкы кабыл алуу\">Зимний набор<\/h3><p data-kg=\"Нөлдөн баштагандар жана IELTS даярдоо\">С нуля и подготовка к IELTS<\/p><span class=\"st\" data-kg=\"алдын ала жазылуу\">предзапись<\/span><\/div>\n      <div class=\"sea\"><div class=\"when\" data-kg=\"Июнь\">Июнь<\/div><h3 data-kg=\"Жайкы интенсив\">Летний интенсив<\/h3><p data-kg=\"1 айда 1 деңгээл: күн сайын 2 сааттан\">Уровень за месяц: по 2 часа каждый день<\/p><span class=\"st\" data-kg=\"алдын ала жазылуу\">предзапись<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Цены ===== -->\n<section class=\"s\" id=\"prices\" style=\"padding-top:10px\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><h2><span class=\"tab\"><svg><use href=\"#i-tag\"/><\/svg><\/span><span data-kg=\"Баалар\">Цены<\/span><\/h2>\n      <p data-kg=\"Айына төлөйсүз, 12 сабак — жумасына 3 жолу 90 мүнөттөн. Китептер баага кирет.\">Оплата помесячно, 12 уроков — 3 раза в неделю по 90 минут. Учебники входят в цену.<\/p><\/div><\/div>\n    <div class=\"card\" style=\"overflow-x:auto\">\n      <table class=\"ptab\">\n        <thead><tr><th><\/th>\n          <th><span data-kg=\"Онлайн топ\">Онлайн-группа<\/span><small>Zoom<\/small><\/th>\n          <th class=\"hl\"><span data-kg=\"Офлайн топ\">Офлайн-группа<\/span><small data-kg=\"көбүрөөк тандашат\">выбирают чаще<\/small><\/th>\n          <th><span data-kg=\"Жеке\">Индивидуально<\/span><small data-kg=\"1 сабак\">за урок<\/small><\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td data-kg=\"Баасы\">Стоимость<\/td><td><span class=\"sum\">3 900 <small data-kg=\"сом/ай\">сом/мес<\/small><\/span><\/td><td class=\"hl\"><span class=\"sum\">4 500 <small data-kg=\"сом/ай\">сом/мес<\/small><\/span><\/td><td><span class=\"sum\">900 <small data-kg=\"сом\">сом<\/small><\/span><\/td><\/tr>\n          <tr><td data-kg=\"Топто\">В группе<\/td><td data-kg=\"8 адамга чейин\">до 8 человек<\/td><td class=\"hl\">6–8<\/td><td data-kg=\"сиз жана мугалим\">вы и преподаватель<\/td><\/tr>\n          <tr><td data-kg=\"Китептер\">Учебники<\/td><td><svg><use href=\"#i-check\"/><\/svg><\/td><td class=\"hl\"><svg><use href=\"#i-check\"/><\/svg><\/td><td><svg><use href=\"#i-check\"/><\/svg><\/td><\/tr>\n          <tr><td data-kg=\"Сабактын жазуусу\">Запись урока<\/td><td><svg><use href=\"#i-check\"/><\/svg><\/td><td class=\"hl no\">—<\/td><td class=\"no\">—<\/td><\/tr>\n          <tr><td>Speaking club<\/td><td class=\"no\">—<\/td><td class=\"hl\"><svg><use href=\"#i-check\"/><\/svg><\/td><td class=\"no\">—<\/td><\/tr>\n          <tr><td data-kg=\"Сертификат\">Сертификат<\/td><td><svg><use href=\"#i-check\"/><\/svg><\/td><td class=\"hl\"><svg><use href=\"#i-check\"/><\/svg><\/td><td><svg><use href=\"#i-check\"/><\/svg><\/td><\/tr>\n        <\/tbody>\n      <\/table>\n      <div class=\"pfoot\"><span data-kg=\"Сынамык сабак жана деңгээлди аныктоо — бекер, 40 мүнөт\">Пробный урок и определение уровня — бесплатно, 40 минут<\/span><a class=\"btn btn-ink\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Сынамык сабакка жазылуу\">Записаться на пробный урок<\/span><\/a><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Преподаватели ===== -->\n<section class=\"s\" id=\"team\" style=\"padding-top:10px\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><h2><span class=\"tab\"><svg><use href=\"#i-cap\"/><\/svg><\/span><span data-kg=\"Мугалимдер\">Преподаватели<\/span><\/h2>\n      <p data-kg=\"Ар бир мугалимдин астында — анын топтору. Мугалимди тандап, ошол топко жазылсаңыз болот.\">Под каждым преподавателем — его группы. Можно выбрать преподавателя и записаться к нему.<\/p><\/div><\/div>\n    <div class=\"team\">\n      <article class=\"card tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b>Айпери Т.<\/b><div class=\"sp\" data-kg=\"Сүйлөшүү англисчеси · Elementary–Intermediate\">Разговорный английский · Elementary–Intermediate<\/div><div class=\"gr\"><span data-kg=\"ДШ·ШР·ЖМ 09:30\">ПН·СР·ПТ 09:30<\/span><span data-kg=\"ДШ·ШР·ЖМ 14:00\">ПН·СР·ПТ 14:00<\/span><\/div><\/div><\/article>\n      <article class=\"card tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b>Нурсултан А.<\/b><div class=\"sp\" data-kg=\"IELTS 8.0 · Upper-Intermediate–Advanced\">IELTS 8.0 · Upper-Intermediate–Advanced<\/div><div class=\"gr\"><span data-kg=\"ДШ·ШР 19:00\">ПН·СР 19:00<\/span><span data-kg=\"ИШ 12:00\">СБ 12:00<\/span><\/div><\/div><\/article>\n      <article class=\"card tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b>Алина К.<\/b><div class=\"sp\" data-kg=\"Өспүрүмдөр 12–17 · грамматика · CELTA\">Подростки 12–17 · грамматика · CELTA<\/div><div class=\"gr\"><span data-kg=\"ШЕ·БШ·ИШ 10:30\">ВТ·ЧТ·СБ 10:30<\/span><span data-kg=\"ШЕ·БШ 15:30\">ВТ·ЧТ 15:30<\/span><\/div><\/div><\/article>\n      <article class=\"card tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b>Эрлан М.<\/b><div class=\"sp\" data-kg=\"Бизнес англисчеси · онлайн топтор\">Бизнес-английский · онлайн-группы<\/div><div class=\"gr\"><span data-kg=\"ДШ·ШР·ЖМ 18:30\">ПН·СР·ПТ 18:30<\/span><span data-kg=\"ШЕ·БШ·ИШ 19:30\">ВТ·ЧТ·СБ 19:30<\/span><\/div><\/div><\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Отзывы ===== -->\n<section class=\"s\" id=\"reviews\" style=\"padding-top:10px\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><h2><span class=\"tab\"><svg><use href=\"#i-chat\"/><\/svg><\/span><span data-kg=\"Пикирлер\">Отзывы<\/span><\/h2><\/div>\n      <div class=\"rsum\"><b>4,9<\/b><span data-kg=\"2ГИСте · 7 жыл иштейбиз\">в 2ГИС · работаем 7 лет<\/span><\/div><\/div>\n    <div class=\"rv\">\n      <article class=\"big\">\n        <div class=\"qm\" aria-hidden=\"true\">“<\/div>\n        <blockquote data-kg=\"Эртең мененки 9:30дагы топ мен үчүн бир гана мүмкүнчүлүк болчу: андан кийин жумушка үлгүрөм. 5 айда Elementaryден Intermediateге чейин жеттим, азыр чет элдик кардарлар менен өзүм сүйлөшөм.\">Утренняя группа в 9:30 — единственный вариант, который мне подходил: после урока успеваю на работу. За 5 месяцев дошла от Elementary до Intermediate, теперь сама общаюсь с иностранными клиентами.<\/blockquote>\n        <div class=\"who\"><span class=\"av\">Ж<\/span><div><b>Жылдыз, 29<\/b><span data-kg=\"бухгалтер · эртең мененки топ\">бухгалтер · утренняя группа<\/span><\/div><\/div>\n      <\/article>\n      <div class=\"rcol\">\n        <article class=\"card rc\"><div class=\"stars\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/div><p data-kg=\"Онлайн-топ ыңгайлуу: жазуулар калат, сабакты өткөрүп жиберсем да кууп жетем.\">Онлайн-группа выручает: записи остаются, даже если пропустил — догоняю.<\/p><div class=\"who\"><span class=\"av\">Р<\/span><span><b>Руслан<\/b> · <span data-kg=\"онлайн, кечки\">онлайн, вечер<\/span><\/span><\/div><\/article>\n        <article class=\"card rc\"><div class=\"stars\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/div><p data-kg=\"Кызым 14 жашта, мурун англисчени жактырчу эмес. Азыр сабакка өзү шашып барат.\">Дочери 14, раньше не любила английский. Теперь сама торопится на урок.<\/p><div class=\"who\"><span class=\"av\">Г<\/span><span><b>Гульмира<\/b> · <span data-kg=\"ата-эне\">мама студентки<\/span><\/span><\/div><\/article>\n        <article class=\"card rc\"><div class=\"stars\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/div><p data-kg=\"IELTS 6.5. Нурсултан агай ар бир эссени талдап берди.\">IELTS 6.5. Нурсултан разбирал каждое моё эссе.<\/p><div class=\"who\"><span class=\"av\">А<\/span><span><b>Айбек<\/b> · IELTS<\/span><\/div><\/article>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Контакты ===== -->\n<section class=\"s\" id=\"contacts\" style=\"padding-top:10px\">\n  <div class=\"wrap ct\">\n    <div class=\"card ci\">\n      <h2 data-kg=\"Байланыш\">Контакты<\/h2>\n      <div class=\"row\"><span data-kg=\"Дарек\">Адрес<\/span><b data-kg=\"Ч. Айтматов пр., 4, Ботаникалык бак ТК\">пр. Чынгыза Айтматова, 4, ЖК «Ботанический сад»<\/b><\/div>\n      <div class=\"row\"><span data-kg=\"Телефон\">Телефон<\/span><a href=\"tel:+996558399955\">+996 558 399 955<\/a><\/div>\n      <div class=\"row\"><span>WhatsApp<\/span><a data-wa href=\"#\">+996 500 065 566<\/a><\/div>\n      <div class=\"row\"><span data-kg=\"Иш убактысы\">Часы работы<\/span><b data-kg=\"ДШ–ИШ 9:00–20:00\">Пн–Сб 9:00–20:00<\/b><\/div>\n      <div class=\"row\"><span>Instagram<\/span><a href=\"https://www.instagram.com/envio_bishkek\" target=\"_blank\" rel=\"noopener\">@envio_bishkek<\/a><\/div>\n      <div class=\"cta\"><a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>WhatsApp<\/a><a class=\"btn btn-gis\" data-gis href=\"#\"><svg><use href=\"#i-pin\"/><\/svg><span data-kg=\"2ГИСте ачуу\">Открыть в 2ГИС<\/span><\/a><a class=\"btn btn-line\" href=\"tel:+996558399955\"><svg><use href=\"#i-phone\"/><\/svg><span data-kg=\"Чалуу\">Позвонить<\/span><\/a><\/div>\n meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ENVIO — заговорите на английском<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Commissioner:wght@400;500;600;700&display=swap\">\n<style>\n/* Вариант 3 «Говорим» — для тех, кто стесняется говорить и не знает свой уровень.\n   Мятные стены их классов, белые «облачка» диалога, тёмно-зелёный текст, фиолетовый — только для действий.\n   Главная фишка — живой диалог на первом экране и тест уровня из 10 вопросов с результатом в WhatsApp. */\n:root{\n  --mint:#DCEFE6; --mint-2:#BFE2D2; --deep:#113A2F; --deep-2:#2C5A4C; --muted:#5F7C72; --white:#fff; --line:#C9E3D7;\n  --violet:#6B2C91; --violet-l:#F1E8F8; --sun:#FFE58A; --coral:#F27C5C;\n  --h:\"Literata\",Georgia,serif; --b:\"Commissioner\",system-ui,sans-serif;\n  --mb-bg:#fff; --mb-fg:var(--deep); --ph-bg:#CDE7DB; --ph-fg:#7DA898;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:80px}\nbody{margin:0;background:var(--mint);color:var(--deep);font:16.5px/1.6 var(--b);-webkit-font-smoothing:antialiased}\nh1,h2,h3{font-family:var(--h);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.01em}\na{color:inherit}\nbutton{font:inherit;cursor:pointer}\n:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}\n.wrap{max-width:1180px;margin:0 auto;padding:0 28px}\n.btn{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:16px;padding:14px 22px;font:600 15.5px/1 var(--b);text-decoration:none;white-space:nowrap}\n.btn svg{width:19px;height:19px}\n.btn-wa{background:#25D366;color:#fff}\n.btn-v{background:var(--violet);color:#fff}\n.btn-w{background:#fff;color:var(--deep)}\n.btn-gis{background:#2FB540;color:#fff}\n\n/* ---------- шапка ---------- */\nheader{position:sticky;top:0;z-index:50;background:rgba(220,239,230,.93);backdrop-filter:blur(10px)}\n.hd{display:flex;align-items:center;gap:24px;height:72px;border-bottom:1.5px solid var(--line)}\n.logo{display:flex;align-items:center;gap:10px;text-decoration:none}\n.logo svg{width:42px;height:42px}\n.logo b{font:700 22px/1 var(--h);color:var(--violet)}\n.hd nav{display:flex;gap:20px}\n.hd nav a{text-decoration:none;font-weight:500;font-size:15px;color:var(--deep-2);white-space:nowrap}\n.hd nav a:hover{color:var(--violet)}\n.hd .tel{margin-left:auto;display:flex;align-items:center;gap:10px;text-decoration:none;background:#fff;border-radius:14px;padding:8px 14px 8px 8px}\n.hd .tel i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--deep);color:#fff}\n.hd .tel i svg{width:17px;height:17px}\n.hd .tel b{font:700 16px/1.1 var(--b);white-space:nowrap}\n.hd .tel small{display:block;font-size:11.5px;color:var(--muted)}\n.hd .acts{display:flex;gap:8px;align-items:center}\n.hd .acts .btn{padding:12px 15px;font-size:14px}\n.lang{display:flex;background:#fff;border-radius:12px;padding:3px}\n.lang button{border:0;background:none;border-radius:9px;padding:7px 10px;font:700 12.5px/1 var(--b);color:var(--muted)}\n.lang button[aria-pressed=\"true\"]{background:var(--deep);color:#fff}\n.ic{display:none}\n\n/* ---------- первый экран ---------- */\n.hero{padding:40px 0 44px}\n.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}\n.hero h1{font-size:clamp(34px,4.4vw,58px);font-weight:600}\n.hero .lead{font-size:18.5px;color:var(--deep-2);margin:20px 0 26px;max-width:470px}\n.hero .cta{display:flex;gap:10px;flex-wrap:wrap}\n.hero .cta .btn{padding:16px 24px;font-size:16px}\n.proof{display:flex;align-items:center;gap:14px;margin-top:28px;font-size:14.5px;color:var(--deep-2)}\n.proof .avs{display:flex}\n.proof .avs i{width:36px;height:36px;border-radius:50%;border:3px solid var(--mint);margin-left:-10px;display:grid;place-items:center;font:700 13px var(--b);font-style:normal;color:#fff}\n.proof .avs i:first-child{margin-left:0}\n.proof b{color:var(--deep)}\n\n/* живой диалог */\n.chat{background:#fff;border-radius:32px;padding:20px 20px 16px;box-shadow:0 30px 60px -40px rgba(17,58,47,.5);position:relative}\n.chat-h{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1.5px solid var(--mint)}\n.chat-h .dot{width:10px;height:10px;border-radius:50%;background:#25D366;box-shadow:0 0 0 4px #D9F7E5}\n.chat-h b{font-weight:700}\n.chat-h span{margin-left:auto;font-size:13px;color:var(--muted)}\n.msgs{display:flex;flex-direction:column;gap:10px;padding:18px 4px 6px;min-height:330px}\n.m{max-width:80%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.4;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}\n.m.show{opacity:1;transform:none}\n.m small{display:block;font-size:12px;opacity:.7;margin-top:4px}\n.m.t{background:var(--mint);border-bottom-left-radius:6px;align-self:flex-start}\n.m.s{background:var(--violet);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}\n.m.typing{display:flex;gap:4px;padding:15px 16px}\n.m.typing i{width:7px;height:7px;border-radius:50%;background:#fff;animation:bob 1s infinite}\n.m.typing i:nth-child(2){animation-delay:.15s}.m.typing i:nth-child(3){animation-delay:.3s}\n@keyframes bob{50%{transform:translateY(-4px);opacity:.6}}\n.chat-f{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding-top:10px;border-top:1.5px solid var(--mint)}\n.chat-f b{color:var(--deep)}\n\n/* ---------- общие секции ---------- */\nsection.s{padding:60px 0}\n.sh{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}\n.sh h2{font-size:clamp(28px,3.2vw,42px)}\n.sh p{margin:10px 0 0;color:var(--deep-2);max-width:540px}\n.bub{display:inline-grid;place-items:center;width:52px;height:46px;background:#fff;border-radius:16px 16px 16px 4px;color:var(--violet);margin-bottom:14px}\n.bub svg{width:24px;height:24px}\n.on-w .bub{background:var(--mint)}\n.white{background:#fff}\n\n/* тест уровня */\n.test{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;align-items:center}\n.qcard{background:var(--mint);border-radius:30px;padding:28px;min-height:380px;--qa:var(--violet);--qopt:#fff;--qh:var(--h);--qtrack:#fff;--qnext:#fff;--qr:16px}\n.prog{display:flex;gap:6px;margin-bottom:20px}\n.prog i{flex:1;height:6px;border-radius:6px;background:#fff}\n.prog i.on{background:var(--violet)}\n.qn{font-size:13.5px;color:var(--muted);font-weight:600}\n.qq{font:600 26px/1.3 var(--h);margin:8px 0 20px}\n.qq u{text-decoration:none;border-bottom:3px dotted var(--violet);padding:0 8px}\n.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.opts button{border:0;background:#fff;border-radius:16px;padding:15px 16px;text-align:left;font-weight:600;font-size:16px;color:var(--deep);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}\n.opts button:hover{box-shadow:inset 0 0 0 2px var(--violet)}\n.res{text-align:left}\n.res .lvl{font:700 44px/1 var(--h);color:var(--violet);margin:6px 0 12px}\n.res p{margin:0 0 20px;color:var(--deep-2)}\n.res .row{display:flex;gap:10px;flex-wrap:wrap}\n.res button.again{border:0;background:none;font-weight:600;color:var(--muted);text-decoration:underline;padding:14px 6px}\n.test-side li{display:flex;gap:10px;margin:10px 0}\n.test-side ul{list-style:none;padding:0;margin:20px 0 0}\n.test-side li svg{flex:0 0 20px;height:20px;color:var(--violet);margin-top:3px}\n\n/* урок по минутам */\n.lesson{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}\n.lesson::before{content:\"\";position:absolute;left:4%;right:4%;top:27px;height:3px;background:repeating-linear-gradient(90deg,var(--deep) 0 8px,transparent 8px 16px);opacity:.25}\n.st{padding:0 14px;position:relative}\n.st .min{display:inline-grid;place-items:center;height:56px;min-width:56px;padding:0 12px;border-radius:18px 18px 18px 5px;background:#fff;font:700 15px var(--b);color:var(--violet);margin-bottom:16px;position:relative}\n.st.big .min{background:var(--violet);color:#fff}\n.st h3{font-size:20px;margin-bottom:6px}\n.st p{margin:0;color:var(--deep-2);font-size:14.5px}\n.share{margin-top:30px;display:flex;align-items:center;gap:20px;background:#fff;border-radius:24px;padding:18px 22px}\n.share .bar{flex:1;height:16px;border-radius:10px;background:var(--mint);overflow:hidden;display:flex}\n.share .bar i{display:block;height:100%}\n.share b{font-family:var(--h);font-size:20px}\n.share span{color:var(--muted);font-size:14px}\n\n/* школа vs envio */\n.vs{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n.vs>div{border-radius:28px;padding:26px 28px}\n.vs .old{background:#fff;color:var(--muted)}\n.vs .new{background:var(--deep);color:#fff}\n.vs h3{font-size:22px;margin-bottom:14px}\n.vs .old h3{color:var(--deep-2)}\n.vs ul{list-style:none;margin:0;padding:0}\n.vs li{display:flex;gap:12px;padding:11px 0;border-bottom:1.5px solid rgba(127,160,150,.25)}\n.vs li:last-child{border-bottom:0}\n.vs .old li::before{content:\"×\";font:700 20px/1.1 var(--b);color:var(--coral)}\n.vs .new li svg{flex:0 0 20px;height:20px;color:var(--sun);margin-top:3px}\n\n/* преподаватели */\n.team{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}\n.tm{background:#fff;border-radius:28px;padding:14px 14px 20px}\n.tm .ph{aspect-ratio:5/4;border-radius:20px}\n.tm .hi{position:relative;margin:-26px 0 0 12px;display:inline-block;background:var(--violet);color:#fff;border-radius:14px 14px 14px 4px;padding:8px 13px;font-size:14px;font-weight:600}\n.tm b{display:block;font:700 19px/1.2 var(--h);margin:12px 6px 4px}\n.tm p{margin:0 6px;color:var(--deep-2);font-size:14.5px;line-height:1.45}\n\n/* отзывы было → стало */\n.rvs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}\n.rv{background:#fff;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:10px}\n.rv .was{align-self:flex-start;background:var(--mint);border-radius:18px 18px 18px 5px;padding:10px 14px;font-size:15px;color:var(--deep-2)}\n.rv .was small,.rv .now small{display:block;font-size:11.5px;font-weight:700;opacity:.65;margin-bottom:2px}\n.rv .now{align-self:flex-end;background:var(--violet);color:#fff;border-radius:18px 18px 5px 18px;padding:10px 14px;font-size:15px;max-width:92%}\n.rv .who{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}\n.rv .who i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--deep);font:700 15px var(--b);font-style:normal}\n.rv .who b{color:var(--deep);display:block}\n.stars{display:flex;gap:2px;color:#F2A81D}\n.stars svg{width:15px;height:15px}\n\n/* цены */\n.pr-wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}\n.prs{background:#fff;border-radius:28px;padding:10px 26px}\n.pi{display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:18px 0;border-bottom:1.5px dashed var(--line);align-items:center}\n.pi:last-child{border-bottom:0}\n.pi b{font:600 20px var(--h)}\n.pi span{color:var(--muted);font-size:14px;grid-column:1}\n.pi .sum{grid-row:1/3;grid-column:2;font:700 26px/1 var(--b);text-align:right;font-variant-numeric:tabular-nums}\n.pi .sum small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}\n.free{background:var(--violet);color:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column}\n.free h3{font-size:28px}\n.free p{color:#E6D6F2;margin:12px 0 18px}\n.free .season{background:rgba(255,255,255,.12);border-radius:16px;padding:12px 14px;font-size:14.5px;margin-bottom:18px}\n.free .season b{color:var(--sun)}\n.free .btn{margin-top:auto;justify-content:center}\n\n/* вопросы */\n.faq{max-width:820px}\n.faq details{background:#fff;border-radius:20px;margin-bottom:10px;padding:0 22px}\n.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:600;font-size:17px;display:flex;gap:14px;align-items:center}\n.faq summary::-webkit-details-marker{display:none}\n.faq summary::before{content:\"?\";flex:0 0 30px;height:30px;border-radius:10px 10px 10px 3px;background:var(--mint);display:grid;place-items:center;font:700 15px var(--h);color:var(--violet)}\n.faq details[open] summary::before{content:\"!\";background:var(--violet);color:#fff}\n.faq p{margin:0 0 18px 44px;color:var(--deep-2)}\n\n/* контакты */\n.ct{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n.cc{background:var(--deep);color:#fff;border-radius:30px;padding:32px}\n.cc h2{font-size:clamp(26px,3vw,38px)}\n.cc .line{display:flex;gap:14px;margin-top:18px}\n.cc .line svg{flex:0 0 22px;height:22px;color:var(--sun);margin-top:3px}\n.cc .line b{display:block;font-size:17px}\n.cc .line a{text-decoration:none}\n.cc .line span{color:#A9CBBE;font-size:14px}\n.cc .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}\n.map{border-radius:30px;overflow:hidden;position:relative;min-height:340px;background:#CFE7DC}\n.map svg{position:absolute;inset:0;width:100%;height:100%}\n.map .pinm{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%)}\n.map .pinm b{display:block;background:#fff;color:var(--deep);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:14px;white-space:nowrap;box-shadow:0 14px 30px -14px rgba(17,58,47,.6)}\n.map .btn{position:absolute;left:16px;bottom:16px}\nfooter{padding:24px 0 34px;color:var(--muted);font-size:13.5px}\nfooter .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}\n\n/* ---------- адаптив ---------- */\n@media (max-width:1240px){.hd nav{display:none}}\n@media (max-width:1060px){.team{grid-template-columns:repeat(2,1fr)}.lesson{grid-template-columns:1fr 1fr 1fr}}\n@media (max-width:760px){\n  .wrap{padding:0 16px}\n  .hd{height:62px;gap:10px}\n  .logo svg{width:36px;height:36px}\n  .hd .tel,.hd .acts .btn{display:none}\n  .hd .acts{margin-left:auto}\n  .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#fff}\n  .ic.w{background:#25D366;color:#fff}\n  .ic svg{width:20px;height:20px}\n  .hero{padding:24px 0 30px}\n  .hero .wrap,.test,.vs,.rvs,.pr-wrap,.ct{grid-template-columns:1fr}\n  .hero .wrap{gap:26px}\n  .hero h1{font-size:32px}\n  .hero .lead{font-size:16.5px;margin:14px 0 20px}\n  .hero .cta .btn{flex:1;justify-content:center}\n  .msgs{min-height:290px}\n  .m{font-size:15px}\n  section.s{padding:44px 0}\n  .sh{display:block}\n  .qcard{padding:22px 18px;min-height:0}\n  .qq{font-size:21px}\n  .opts{grid-template-columns:1fr}\n  .test-side{order:-1}\n  .lesson{grid-template-columns:1fr;gap:14px}\n  .lesson::before{left:27px;right:auto;top:10px;bottom:10px;width:3px;height:auto;background:repeating-linear-gradient(180deg,var(--deep) 0 8px,transparent 8px 16px)}\n  .st{display:grid;grid-template-columns:56px 1fr;gap:0 14px;padding:0}\n  .st .min{margin:0;grid-row:1/3;font-size:13px;padding:0 6px}\n  .share{flex-direction:column;align-items:stretch;gap:10px}\n  .team{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}\n  .tm{flex:0 0 72%;scroll-snap-align:start}\n  .rvs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}\n  .rv{flex:0 0 84%;scroll-snap-align:start}\n  .faq p{margin-left:0}\n  .cc{padding:24px 20px}.cc .cta .btn{flex:1;justify-content:center}\n  .map{min-height:240px}\n}\n<\/style>\n<\/head>\n<body>\n<!--SWITCH:START-->\n<style>\n  .sw-bar{position:sticky;top:0;z-index:100;display:none;align-items:center;gap:12px;flex-wrap:wrap;\n    background:#1a1028;color:#fff;font:500 13px/1.2 system-ui,\"Segoe UI\",sans-serif;\n    padding:7px max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left))}\n  body.has-sw .sw-bar{display:flex}\n  body.has-sw header{top:var(--swh,44px)}\n  .sw-bar .sw-t{font-weight:700;letter-spacing:.08em;white-space:nowrap}\n  .sw-bar .sw-t span{font-weight:400;letter-spacing:0;color:#a99b /><path d=\"m31.5 11.3 5.4 5.6 1.5-7.8z\" fill=\"#fff\"/><\/svg>\n      <b>Envio<\/b>\n    <\/a>\n    <nav aria-label=\"Разделы\">\n      <a href=\"#test\" data-kg=\"Деңгээл тести\">Тест уровня<\/a>\n      <a href=\"#lesson\" data-kg=\"Сабак кандай өтөт\">Как проходит урок<\/a>\n      <a href=\"#team\" data-kg=\"Мугалимдер\">Преподаватели<\/a>\n      <a href=\"#prices\" data-kg=\"Баалар\">Цены<\/a>\n      <a href=\"#contacts\" data-kg=\"Байланыш\">Контакты<\/a>\n    <\/nav>\n    <a class=\"tel\" href=\"tel:+996558399955\"><i><svg><use href=\"#i-phone\"/><\/svg><\/i><span><b>+996 558 399 955<\/b><small data-kg=\"ДШ–ИШ 9:00–20:00\">Пн–Сб 9:00–20:00<\/small><\/span><\/a>\n    <div class=\"acts\">\n      <a class=\"btn btn-gis\" data-gis href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a>\n      <a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>WhatsApp<\/a>\n      <a class=\"ic\" href=\"tel:+996558399955\" aria-label=\"Позвонить\" data-kg-aria=\"Чалуу\"><svg><use href=\"#i-phone\"/><\/svg><\/a>\n      <a class=\"ic w\" data-wa href=\"#\" aria-label=\"WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a>\n      <div class=\"lang\" role=\"group\" aria-label=\"Язык\"><button data-l=\"ru\">RU<\/button><button data-l=\"kg\">KG<\/button><\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n<!-- ===== Первый экран: живой диалог ===== -->\n<section class=\"hero\">\n  <div class=\"wrap\">\n    <div>\n      <h1 data-kg=\"Англисче коркпой сүйлөп баштаңыз\">Заговорите на английском без страха<\/h1>\n      <p class=\"lead\" data-kg=\"Жаттоо жок жана зериктирүүчү сабак жок. Сабактын жарымынан көбү — сүйлөшүү: жупта, оюнда, жашоодогу кырдаалдарда. 7 жылдан бери Бишкекти ишенимдүү сүйлөөгө үйрөтөбүз.\">Без зубрёжки и скучных уроков. Больше половины урока — разговор: в парах, в играх, в жизненных ситуациях. 7 лет учим Бишкек говорить увереннее.<\/p>\n      <div class=\"cta\">\n        <a class=\"btn btn-v\" href=\"#test\"><svg><use href=\"#i-q\"/><\/svg><span data-kg=\"Деңгээлди 2 мүнөттө билүү\">Узнать уровень за 2 минуты<\/span><\/a>\n        <a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Сынамык сабак\">Пробный урок<\/span><\/a>\n      <\/div>\n      <div class=\"proof\">\n        <span class=\"avs\" aria-hidden=\"true\"><i style=\"background:#6B2C91\">Д<\/i><i style=\"background:#2C5A4C\">Т<\/i><i style=\"background:#F27C5C\">А<\/i><i style=\"background:#3D7BC4\">Б<\/i><\/span>\n        <span data-kg=\"<b>14,9 миң<\/b> адам Instagramда биз менен\">С нами <b>14,9 тыс.<\/b> человек в Instagram<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"chat\" aria-label=\"Пример диалога на уроке\">\n      <div class=\"chat-h\"><span class=\"dot\"><\/span><b data-kg=\"Intermediate тобундагы сабак\">Урок в группе Intermediate<\/b><span>18:30<\/span><\/div>\n      <div class=\"msgs\" id=\"msgs\" aria-live=\"off\"><\/div>\n      <div class=\"chat-f\"><span data-kg=\"Сабакта ушундай сүйлөшөбүз\">Так мы разговариваем на уроке<\/span><b data-kg=\"3-сабак → 24-сабак\">урок 3 → урок 24<\/b><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Тест уровня ===== -->\n<section class=\"s white on-w\" id=\"test\">\n  <div class=\"wrap test\">\n    <div class=\"test-side\">\n      <span class=\"bub\"><svg><use href=\"#i-q\"/><\/svg><\/span>\n      <h2 data-kg=\"Деңгээлиңизди 2 мүнөттө билиңиз\">Узнайте свой уровень за 2 минуты<\/h2>\n      <p style=\"color:var(--deep-2)\" data-kg=\"10 суроо — деңгээл жана ылайыктуу топ дароо чыгат. Жыйынтыкты WhatsAppка бир баскыч менен жөнөтөсүз же бизге чаласыз.\">10 вопросов — сразу покажем уровень и подходящую группу. Результат отправите в WhatsApp одной кнопкой или позвоните нам.<\/p>\n      <ul>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Каттоосуз жана телефонсуз\">Без регистрации и номера телефона<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Так деңгээлди сынамык сабакта тактайбыз\">Точный уровень уточним на пробном уроке<\/span><\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"qcard\" id=\"qcard\" aria-live=\"polite\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Как проходит урок ===== -->\n<section class=\"s\" id=\"lesson\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"bub\"><svg><use href=\"#i-clock\"/><\/svg><\/span>\n      <h2 data-kg=\"90 мүнөттүк сабак кандай өтөт\">Как проходит урок за 90 минут<\/h2>\n      <p data-kg=\"Эрежени жаттабайбыз — аны кырдаалда колдонобуз.\">Правило не заучиваем — сразу используем его в ситуации.<\/p><\/div><\/div>\n    <div class=\"lesson\">\n      <div class=\"st\"><span class=\"min\">0–10<\/span><h3 data-kg=\"Жылытуу\">Разминка<\/h3><p data-kg=\"Жумаңыз кандай өттү — англисче, кыскача\">Как прошла неделя — на английском, коротко<\/p><\/div>\n      <div class=\"st\"><span class=\"min\">10–30<\/span><h3 data-kg=\"Жаңы тема\">Новая тема<\/h3><p data-kg=\"Видео же кырдаал аркылуу, таблицасыз\">Через видео или ситуацию, без таблиц<\/p><\/div>\n      <div class=\"st big\"><span class=\"min\">30–60<\/span><h3 data-kg=\"Жупта сүйлөшүү\">Разговор в парах<\/h3><p data-kg=\"Ролдор: кафе, маек, саякат\">Роли: кафе, собеседование, поездка<\/p><\/div>\n      <div class=\"st\"><span class=\"min\">60–80<\/span><h3 data-kg=\"Оюн же сериал\">Игра или сериал<\/h3><p data-kg=\"Сөздөрдү эстеп калуу үчүн\">Чтобы слова запомнились сами<\/p><\/div>\n      <div class=\"st\"><span class=\"min\">80–90<\/span><h3 data-kg=\"Жыйынтык\">Итог<\/h3><p data-kg=\"Үй тапшырма — чатка аудио билдирүү\">Домашка — голосовое в чат группы<\/p><\/div>\n    <\/div>\n    <div class=\"share\">\n      <div><b data-kg=\"60%\">60%<\/b> <span data-kg=\"сабактын — сиз сүйлөйсүз\">урока — говорите вы<\/span><\/div>\n      <div class=\"bar\" aria-hidden=\"true\"><i style=\"width:60%;background:var(--violet)\"><\/i><i style=\"width:25%;background:var(--deep-2)\"><\/i><i style=\"width:15%;background:var(--sun)\"><\/i><\/div>\n      <span data-kg=\"мугалим 25% · жазуу 15%\">преподаватель 25% · письмо 15%<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Школа vs ENVIO ===== -->\n<section class=\"s\" style=\"padding-top:0\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"bub\"><svg><use href=\"#i-chat\"/><\/svg><\/span><h2 data-kg=\"Мектептеги англисче менен айырмасы\">Чем это не похоже на школьный английский<\/h2><\/div><\/div>\n    <div class=\"vs\">\n      <div class=\"old\"><h3 data-kg=\"Адаттагыдай\">Как обычно<\/h3><ul>\n        <li data-kg=\"Эрежелер жана сөз тизмелерин жаттоо\">Заучивать правила и списки слов<\/li>\n        <li data-kg=\"Сабак бою мугалим сүйлөйт\">Весь урок говорит преподаватель<\/li>\n        <li data-kg=\"Каталар үчүн уят болот\">За ошибки стыдно<\/li>\n        <li data-kg=\"30 адамдык класс\">Класс на 30 человек<\/li><\/ul><\/div>\n      <div class=\"new\"><h3 data-kg=\"ENVIOдо\">В ENVIO<\/h3><ul>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Сөздөрдү кырдаалда колдонобуз — өзү эстелет\">Слова используем в ситуациях — запоминаются сами<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Сабактын 60% — сиз сүйлөйсүз\">60% урока говорите вы<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Ката — бул машыгуу, аны жумшак оңдойбуз\">Ошибка — это тренировка, поправляем мягко<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Топто 6–8 адам\">В группе 6–8 человек<\/span><\/li><\/ul><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Преподаватели ===== -->\n<section class=\"s white on-w\" id=\"team\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"bub\"><svg><use href=\"#i-cap\"/><\/svg><\/span><h2 data-kg=\"Сиз менен ким сүйлөшөт\">Кто будет с вами говорить<\/h2>\n      <p data-kg=\"Жумшак, бирок талапчыл. Ар биринин өз багыты бар.\">Мягкие, но требовательные. У каждого своё направление.<\/p><\/div><\/div>\n    <div class=\"team\">\n      <article class=\"tm\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><span class=\"hi\">Hi, I'm Aiperi!<\/span><b>Айпери Т.<\/b><p data-kg=\"Сүйлөшүү англисчеси, нөлдөн баштагандар. Уялгандарды сүйлөтөт.\">Разговорный английский, с нуля. Разговорит даже самых стеснительных.<\/p><\/article>\n      <article class=\"tm\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><span class=\"hi\">Hi, I'm Nursultan!<\/span><b>Нурсултан А.<\/b><p data-kg=\"IELTS 8.0. Эссе жана Speaking бөлүгүнө даярдайт.\">IELTS 8.0. Готовит к эссе и Speaking-части.<\/p><\/article>\n      <article class=\"tm\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><span class=\"hi\">Hi, I'm Alina!<\/span><b>Алина К.<\/b><p data-kg=\"Өспүрүмдөр 12–17 жаш. Грамматиканы оюн аркылуу түшүндүрөт.\">Подростки 12–17 лет. Объясняет грамматику через игры.<\/p><\/article>\n      <article class=\"tm\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><span class=\"hi\">Hi, I'm Erlan!<\/span><b>Эрлан М.<\/b><p data-kg=\"Бизнес англисчеси: маек, жолугушуу, кат алышуу.\">Бизнес-английский: собеседования, встречи, переписка.<\/p><\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Отзывы было → стало ===== -->\n<section class=\"s\" id=\"reviews\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"bub\"><svg><use href=\"#i-star\"/><\/svg><\/span><h2 data-kg=\"Мурун эмне болчу → азыр эмне\">Было → стало<\/h2>\n      <p data-kg=\"Студенттер өздөрү айтып беришет.\">Студенты рассказывают сами.<\/p><\/div>\n      <div class=\"stars\" aria-label=\"Оценка 4,9 в 2ГИС\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><span style=\"color:var(--deep);font-weight:700;margin-left:6px\" data-kg=\"4,9 · 2ГИС\">4,9 в 2ГИС<\/span><\/div><\/div>\n    <div class=\"rvs\">\n      <article class=\"rv\"><div class=\"was\"><small data-kg=\"МУРУН\">БЫЛО<\/small><span data-kg=\"Баарын түшүнөм, бирок бир сөз айта албайм\">Всё понимаю, но не могу сказать ни слова<\/span><\/div><div class=\"now\"><small data-kg=\"АЗЫР\">СТАЛО<\/small><span data-kg=\"Чет элдик кардарлар менен жолугушууларды өзүм өткөрөм\">Сама веду встречи с иностранными клиентами<\/span><\/div><div class=\"who\"><i>Д<\/i><span><b>Дария, 24<\/b><span data-kg=\"4 ай · Pre-Intermediate\">4 месяца · Pre-Intermediate<\/span><\/span><\/div><\/article>\n      <article class=\"rv\"><div class=\"was\"><small data-kg=\"МУРУН\">БЫЛО<\/small><span data-kg=\"Мектепте англисчеден «3» алчумун\">В школе по английскому была «тройка»<\/span><\/div><div class=\"now\"><small data-kg=\"АЗЫР\">СТАЛО<\/small><span data-kg=\"Сериалдарды субтитрсиз көрөм, айдын студенти болдум\">Смотрю сериалы без субтитров, стал студентом месяца<\/span><\/div><div class=\"who\"><i>Т<\/i><span><b>Темирлан, 17<\/b><span data-kg=\"8 ай · Upper-Intermediate\">8 месяцев · Upper-Intermediate<\/span><\/span><\/div><\/article>\n      <article class=\"rv\"><div class=\"was\"><small data-kg=\"МУРУН\">БЫЛО<\/small><span data-kg=\"IELTS тапшырууга коркчумун\">Боялся сдавать IELTS<\/span><\/div><div class=\"now\"><small data-kg=\"АЗЫР\">СТАЛО<\/small><span data-kg=\"Биринчи жолу эле 6.5 алдым\">Сдал на 6.5 с первого раза<\/span><\/div><div class=\"who\"><i>Б<\/i><span><b>Бекжан, 26<\/b><span data-kg=\"5 ай · онлайн\">5 месяцев · онлайн<\/span><\/span><\/div><\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Цены и наборы ===== -->\n<section class=\"s\" id=\"prices\" style=\"padding-top:0\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"bub\"><svg><use href=\"#i-tag\"/><\/svg><\/span><h2 data-kg=\"Баалар жана формат\">Цены и формат<\/h2>\n      <p data-kg=\"Айына 12 сабак, ар бири 90 мүнөт. Китептер баага кирет.\">12 уроков в месяц по 90 минут. Учебники входят в цену.<\/p><\/div><\/div>\n    <div class=\"pr-wrap\">\n      <div class=\"prs\">\n        <div class=\"pi\"><b data-kg=\"Офлайн топ\">Офлайн-группа<\/b><span data-kg=\"Ботаникалык бак ТК · 6–8 адам · speaking club\">ЖК «Ботанический сад» · 6–8 человек · speaking club<\/span><div class=\"sum\">4 500 <small data-kg=\"сом / ай\">сом / мес<\/small><\/div><\/div>\n        <div class=\"pi\"><b data-kg=\"Онлайн топ\">Онлайн-группа<\/b><span data-kg=\"Zoom · сабактын жазуулары\">Zoom · записи уроков<\/span><div class=\"sum\">3 900 <small data-kg=\"сом / ай\">сом / мес<\/small><\/div><\/div>\n        <div class=\"pi\"><b data-kg=\"Жеке\">Индивидуально<\/b><span data-kg=\"IELTS, жумуш, көчүү\">IELTS, работа, переезд<\/span><div class=\"sum\">900 <small data-kg=\"сом / сабак\">сом / урок<\/small><\/div><\/div>\n        <div class=\"pi\"><b data-kg=\"Өспүрүмдөр 12–17\">Подростки 12–17<\/b><span data-kg=\"Өзүнчө топтор, ата-энеге отчет\">Отдельные группы, отчёт родителям<\/span><div class=\"sum\">4 200 <small data-kg=\"сом / ай\">сом / мес<\/small><\/div><\/div>\n      <\/div>\n      <div class=\"free\">\n        <h3 data-kg=\"Сынамык сабак — бекер\">Пробный урок — бесплатно<\/h3>\n        <p data-kg=\"40 мүнөт: деңгээлди аныктайбыз, мугалим менен таанышасыз жана топтун атмосферасын сезесиз.\">40 минут: определим уровень, познакомитесь с преподавателем и почувствуете атмосферу группы.<\/p>\n        <div class=\"season\"><b data-kg=\"Күзгү кабыл алуу 15-ноябрга чейин.\">Осенний набор до 15 ноября.<\/b> <span data-kg=\"Эртең мененки топтор: ДШ·ШР·ЖМ 9:30 жана ШЕ·БШ·ИШ 10:30\">Утренние группы: ПН·СР·ПТ 9:30 и ВТ·ЧТ·СБ 10:30<\/span><\/div>\n        <a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Сынамык сабакка жазылуу\">Записаться на пробный урок<\/span><\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Вопросы ===== -->\n<section class=\"s\" id=\"faq\" style=\"padding-top:0\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"bub\"><svg><use href=\"#i-q\"/><\/svg><\/span><h2 data-kg=\"Эгер коркунучтуу болсо\">Если страшно начинать<\/h2><\/div><\/div>\n    <div class=\"faq\">\n      <details open><summary data-kg=\"Мен таптакыр нөлдөн баштайм — уят болбойбу?\">Я совсем с нуля — не будет стыдно?<\/summary><p data-kg=\"Жок. Elementary тобунда баары нөлдөн. Биринчи сабактан тартып жөнөкөй сөздөр менен сүйлөйсүз.\">Нет. В группе Elementary все начинают с нуля. С первого урока говорите простыми фразами.<\/p><\/details>\n      <details><summary data-kg=\"Мен 35+ жаштамын, кеч эмеспи?\">Мне 35+, не поздно?<\/summary><p data-kg=\"Студенттерибиздин үчтөн бири — 30 жаштан жогору. Эрте менен 9:30дагы топтор ушулар үчүн ыңгайлуу.\">Треть наших студентов старше 30. Утренние группы в 9:30 как раз для них.<\/p><\/details>\n      <details><summary data-kg=\"Топко ылайык келбесем эмне болот?\">Что, если не подойду группе?<\/summary><p data-kg=\"Биринчи айда акысыз башка топко которобуз.\">В первый месяц бесплатно переведём в другую группу.<\/p><\/details>\n      <details><summary data-kg=\"Үй тапшырма көппү?\">Много домашки?<\/summary><p data-kg=\"20–30 мүнөт: аудио билдирүү, кыска видео же 5 сүйлөм.\">20–30 минут: голосовое, короткое видео или 5 предложений.<\/p><\/details>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Контакты ===== -->\n<section class=\"s\" id=\"contacts\" style=\"padding-top:0\">\n  <div class=\"wrap ct\">\n    <div class=\"cc\">\n      <h2 data-kg=\"Келиңиз, сүйлөшөлү\">Приходите — поговорим<\/h2>\n      <div class=\"line\"><svg><use href=\"#i-pin\"/><\/svg><div><b data-kg=\"Ч. Айтматов пр., 4\">пр. Чынгыза Айтматова, 4<\/b><span data-kg=\"Ботаникалык бак ТК, Бишкек\">ЖК «Ботанический сад», Бишкек<\/span><\/div><\/div>\n      <div class=\"line\"><svg><use href=\"#i-phone\"/><\/svg><div><a href=\"tel:+996558399955\"><b>+996 558 399 955<\/b><\/a><span data-kg=\"чалуу\">звонки<\/span><\/div><\/div>\n      <div class=\"line\"><svg><use href=\"#i-wa\"/><\/svg><div><a data-wa href let v="1", d="pc";
const frame=document.getElementById("frame"), phone=document.getElementById("phone");
function readHash(){const m=location.hash.match(/v([123])-(pc|mob)/); if(m){v=m[1];d=m[2];}}
function fit(){
  if(d!=="mob"){phone.style.transform="";phone.style.margin="";return;}
  const st=document.getElementById("stage").getBoundingClientRect();
  const s=Math.min(1,(st.height-40)/900,(st.width-40)/414);
  phone.style.transform=`scale(${s})`;
  phone.style.margin=`${-(900*(1-s))/2}px ${-(414*(1-s))/2}px`;
}
let shown=null;
function apply(){
  const want=D[v].file;
  if(shown!==want){shown=want; frame.srcdoc=DESIGNS[want];}
  document.body.className=d;
  document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  document.querySelectorAll("[data-d]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===d));
  document.getElementById("info").textContent=D[v].info;
  document.getElementById("notes").innerHTML=`<h2>${D[v].name}: телефон</h2><p>Что сделано для мобильной версии:</p><ul>${D[v].mob.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  document.title="ENVIO — "+D[v].name+(d==="mob"?" (телефон)":"");
  history.replaceState(null,"","#v"+v+"-"+d);
  fit();
}
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{v=b.dataset.v;apply();});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{d=b.dataset.d;apply();});
addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if(["1","2","3"].includes(e.key)){v=e.key;apply();}
  if(e.key==="m"||e.key==="ь"){d=d==="pc"?"mob":"pc";apply();}
});
addEventListener("resize",fit);
// ссылки-якоря внутри макета прокручивают страницу, а не перезагружают рамку
frame.addEventListener("load",()=>{
  const doc=frame.contentDocument;
  doc.addEventListener("click",e=>{
    const link=e.target.closest('a[href^="#"]'); if(!link)return;
    e.preventDefault();
    const id=link.getAttribute("href").slice(1), target=id&&doc.getElementById(id);
    if(target)target.scrollIntoView({behavior:"smooth"}); else frame.contentWindow.scrollTo({top:0,behavior:"smooth"});
  });
});
readHash(); apply();
